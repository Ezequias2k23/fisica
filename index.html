<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Lei de Ohm</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e9f5fc;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #555;
            font-size: 14px;
            text-align: left;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #f9f9f9;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }
        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
        footer a {
            color: #007bff;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calculadora - Lei de Ohm</h2>

        <label for="escolha">O que você deseja calcular?</label>
        <select id="escolha" onchange="atualizarFormulario()">
            <option value="corrente">Corrente (I)</option>
            <option value="tensao">Tensão (V)</option>
            <option value="resistencia">Resistência (R)</option>
        </select>

        <div id="formulario">
        </div>

        <button onclick="calcular()">Calcular</button>

        <div id="resultado"></div>
        
        <footer>
            Desenvolvido por <a href="#">Ezequias, Diogo e Erick dus grau</a>.
        </footer>
    </div>

    <script>
        function atualizarFormulario() {
            const escolha = document.getElementById("escolha").value;
            const formulario = document.getElementById("formulario");

            if (escolha === "corrente") {
                formulario.innerHTML = `
                    <label for="tensao">Digite a tensão (V):</label>
                    <input type="number" id="tensao" placeholder="Ex.: 12" required>

                    <label for="resistencia">Digite a resistência (R):</label>
                    <input type="number" id="resistencia" placeholder="Ex.: 6" required>
                `;
            } else if (escolha === "tensao") {
                formulario.innerHTML = `
                    <label for="corrente">Digite a corrente (I):</label>
                    <input type="number" id="corrente" placeholder="Ex.: 2" required>

                    <label for="resistencia">Digite a resistência (R):</label>
                    <input type="number" id="resistencia" placeholder="Ex.: 6" required>
                `;
            } else if (escolha === "resistencia") {
                formulario.innerHTML = `
                    <label for="tensao">Digite a tensão (V):</label>
                    <input type="number" id="tensao" placeholder="Ex.: 12" required>

                    <label for="corrente">Digite a corrente (I):</label>
                    <input type="number" id="corrente" placeholder="Ex.: 2" required>
                `;
            }
        }

        function calcular() {
            const escolha = document.getElementById("escolha").value;
            let resultado = "";

            if (escolha === "corrente") {
                const tensao = parseFloat(document.getElementById("tensao").value);
                const resistencia = parseFloat(document.getElementById("resistencia").value);

                if (isNaN(tensao) || isNaN(resistencia) || resistencia === 0) {
                    resultado = "Por favor, insira valores válidos.";
                } else {
                    const corrente = tensao / resistencia;
                    resultado = `A corrente é ${corrente.toFixed(2)} amperes.`;
                }
            } else if (escolha === "tensao") {
                const corrente = parseFloat(document.getElementById("corrente").value);
                const resistencia = parseFloat(document.getElementById("resistencia").value);

                if (isNaN(corrente) || isNaN(resistencia)) {
                    resultado = "Por favor, insira valores válidos.";
                } else {
                    const tensao = corrente * resistencia;
                    resultado = `A tensão é ${tensao.toFixed(2)} volts.`;
                }
            } else if (escolha === "resistencia") {
                const tensao = parseFloat(document.getElementById("tensao").value);
                const corrente = parseFloat(document.getElementById("corrente").value);

                if (isNaN(tensao) || isNaN(corrente) || corrente === 0) {
                    resultado = "Por favor, insira valores válidos.";
                } else {
                    const resistencia = tensao / corrente;
                    resultado = `A resistência é ${resistencia.toFixed(2)} ohms.`;
                }
            }

            document.getElementById("resultado").innerHTML = resultado;
        }

        atualizarFormulario();
    </script>
</body>
</html>
